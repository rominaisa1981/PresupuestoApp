<app-navbar />

<div class="min-h-screen bg-slate-950 p-4 md:p-6">
  <div class="max-w-md mx-auto">

    <div class="flex items-center gap-3 mb-6">
      <a [routerLink]="['/quincenas', quincenaId]"
         class="text-slate-400 hover:text-white transition-colors text-sm">
        ← Volver
      </a>
      <span class="text-slate-700">|</span>
      <h1 class="text-white font-bold text-lg">Agregar Movimiento</h1>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-4">

        @if (error) {
          <div class="bg-red-500/10 border border-red-500/30 text-red-400 rounded-lg px-4 py-3 text-sm">
            {{ error }}
          </div>
        }

        <!-- Tipo (radio buttons) -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Tipo</label>
          <div class="grid grid-cols-2 gap-2">
            @for (t of tipos; track t) {
              <label class="flex items-center gap-2 bg-slate-800 border border-slate-700
                            rounded-lg px-3 py-2.5 cursor-pointer transition-all
                            has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10">
                <input type="radio" formControlName="tipo" [value]="t" class="accent-emerald-500" />
                <span class="text-white text-sm">{{ t }}</span>
              </label>
            }
          </div>
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Descripción</label>
          <input formControlName="descripcion" type="text"
                 class="w-full bg-slate-800 border border-slate-700 text-white text-sm
                        rounded-lg px-4 py-2.5 placeholder:text-slate-500
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                 placeholder="Ej: Sueldo Unificado, Tarjeta Diners..." />
        </div>

        <!-- Monto -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Monto ($)</label>
          <input formControlName="monto" type="number" step="0.01" min="0.01"
                 class="w-full bg-slate-800 border border-slate-700 text-white text-sm
                        rounded-lg px-4 py-2.5 placeholder:text-slate-500
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                 placeholder="0.00" />
        </div>

        <!-- Categoría (filtrada por tipo) -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">
            Categoría <span class="text-slate-500">(opcional)</span>
          </label>
          <select formControlName="categoriaId"
                  class="w-full bg-slate-800 border border-slate-700 text-white text-sm
                         rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2
                         focus:ring-emerald-500 transition-all">
            <option [value]="null">-- Sin categoría --</option>
            @for (cat of categorias(); track cat.id) {
              <option [value]="cat.id">{{ cat.nombre }}</option>
            }
          </select>
          <p class="text-slate-500 text-xs mt-1">
            Solo muestra categorías del tipo "{{ form.get('tipo')!.value }}"
          </p>
        </div>

        <!-- ID del padre (para sub-items) -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">
            ID del movimiento padre
            <span class="text-slate-500">(solo si es sub-item)</span>
          </label>
          <input formControlName="movimientoPadreId" type="number"
                 class="w-full bg-slate-800 border border-slate-700 text-white text-sm
                        rounded-lg px-4 py-2.5 placeholder:text-slate-500
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                 placeholder="Dejar vacío si es un movimiento normal" />
          <p class="text-slate-500 text-xs mt-1">
            Ej: PQ1, PQ2... son sub-items del "Préstamo Quirografario".
            Deja esto vacío para movimientos normales.
          </p>
        </div>

        <!-- Notas -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">
            Notas <span class="text-slate-500">(opcional)</span>
          </label>
          <input formControlName="notas" type="text"
                 class="w-full bg-slate-800 border border-slate-700 text-white text-sm
                        rounded-lg px-4 py-2.5 placeholder:text-slate-500
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
                 placeholder="Cualquier nota adicional..." />
        </div>

        <button type="submit" [disabled]="form.invalid || cargando"
                class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-700
                       disabled:text-slate-500 text-white font-medium rounded-lg py-2.5
                       transition-all mt-2">
          {{ cargando ? 'Guardando...' : 'Guardar movimiento' }}
        </button>

      </form>
    </div>
  </div>
</div>
